name: Build ytcc-dl Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK with official buildozer image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不用 ArtemSBulgakov/buildozer-action@v1：它的 Dockerfile 写死了
      # add-apt-repository ppa:openjdk-r/ppa，该 PPA 无 Ubuntu resolute(24.10)
      # 的 Release 文件 -> apt update 404 -> 构建还没开始就失败。
      # 直接用 kivy 官方镜像（自带 JDK/buildozer），绕开这个坏 PPA。
      - name: Cache buildozer SDK/NDK
        uses: actions/cache@v4
        with:
          path: .buildozer-cache
          key: buildozer-sdk-ndk-${{ runner.os }}-v1

      - name: Patch manifest for cleartext HTTP
        run: python3 pre_buildozer.py

      - name: Build APK
        run: |
          mkdir -p .buildozer-cache
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v "$PWD/.buildozer-cache":/home/user/.buildozer \
            -w /home/user/hostcwd \
            kivy/buildozer:latest android debug
          ls -lh bin/*.apk

      - name: Rename APK with version
        run: |
          APK=$(find bin -name "*.apk" | head -1)
          echo "built: $APK"
          cp "$APK" "bin/ytcc-dl-android-v1.0.0.apk"
          ls -lh bin/*.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytcc-dl-android-apk
          path: bin/*.apk
          retention-days: 90

      - name: Publish to fixed Release (兜底：自动创建/更新 ytcc-android-latest)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=ytcc-android-latest
          APK="bin/ytcc-dl-android-v1.0.0.apk"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "ytcc-dl 手机版 (Android)" \
              --notes "国内四站视频下载 APK，从 CookieCloud 拉 cookie。每次打 v* tag 自动重建。apk 直接点下方资产下载到手机安装。"
          gh release upload "$TAG" "$APK" --clobber
